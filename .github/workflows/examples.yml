# Every example must run and print exactly what its recorded .out file says — and
# every lesson page's generated output block must match that run.
#
# This library has five kinds of example, and this job runs all of them:
#   examples/*.py   stdlib-only Python 3.14, the same minor version on both runners
#   examples/*.rs   compiled with bare rustc (no cargo, no crates)
#   examples/*.sh   bash, using xxd / od / hexdump / cat / file / iconv / printf / strings
#   examples/*.c    compiled with cc (clang on macOS, gcc on Ubuntu), no libraries
#   examples/*.go   built one file at a time with go build, stdlib only, by the
#                   current stable Go, which setup-go installs below
#
# It runs on BOTH Ubuntu and macOS on purpose. The shell examples call BSD tools
# on a Mac and GNU tools on Linux, and an answer key that only matches one of
# them is a machine-dependent example — the one kind no local run can catch.

name: examples

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # One Python on both runners: 3.14, the version the answer keys promise
      # (CONTRIBUTING.md, "The programs"). The minor version is pinned and patch
      # releases float. Before this step each runner used its own python3, which
      # on 2026-09-11 was 3.12.3 on Ubuntu and 3.14.7 on macOS.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-go@v7
        with:
          # Unpinned on purpose, like rustc: a Go example's key has to hold on
          # whatever Go is current, so it may only record behaviour the Go 1
          # compatibility promise covers. There is no go.sum, so no cache.
          go-version: stable
          cache: false
      - name: Make sure xxd, hexdump, file and strings are present (separate packages on Ubuntu)
        if: runner.os == 'Linux'
        run: |
          command -v xxd || sudo apt-get install -y xxd
          command -v hexdump || sudo apt-get install -y bsdextrautils
          command -v file || sudo apt-get install -y file
          command -v strings || sudo apt-get install -y binutils
      - name: Show toolchain
        run: |
          python3 --version
          rustc --version
          go version
          cc --version | head -1
          bash --version | head -1
          xxd -v 2>&1 | head -1
      - name: Run every example and check it against its answer key
        run: python3 tools/run_examples.py --check
      - name: Check that every external link is marked as external
        run: python3 tools/check_link_style.py
      - name: Check that every string called decomposed really is
        run: |
          python3 tools/check_decomposed_literals.py --selftest
          python3 tools/check_decomposed_literals.py
      - name: Check that every folded kata answer renders, and was run
        run: |
          python3 tools/check_katas.py --selftest
          python3 tools/check_katas.py
      - name: Check that the chapter map, the chapter tables and ROADMAP agree with the tree
        run: |
          python3 tools/check_chapter_status.py --selftest
          python3 tools/check_chapter_status.py
      - name: Check that every link to a heading names it by one id on GitHub and on the site
        run: |
          python3 tools/check_fragments.py --selftest
          python3 tools/check_fragments.py
