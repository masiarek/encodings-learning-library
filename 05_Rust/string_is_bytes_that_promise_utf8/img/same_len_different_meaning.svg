<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 596" width="900" height="596" role="img"
     aria-label="Three Rust strings drawn as bytes. noodles is seven ASCII bytes and seven characters. oodles borrows six of them. poodles is the three-character string U+0CA0 underscore U+0CA0, which is seven bytes because each Kannada character takes three. noodles and poodles both report len equals 7.">
  <style>
    .bg   { fill:#ffffff; stroke:#d0d7de; }
    .code { font:15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:#0b2942; }
    .cell { fill:#cfe3f3; stroke:#1f4e79; stroke-width:1.2; }
    .cel2 { fill:#f6dfc4; stroke:#9a5b12; stroke-width:1.2; }
    .glyph{ font:17px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:#0b2942; text-anchor:middle; }
    .hex  { font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:#4a5568; text-anchor:middle; }
    .lab  { font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill:#3d4852; }
    .tag  { font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill:#0b2942; font-weight:600; }
    .rule { stroke:#1f4e79; stroke-width:1.4; fill:none; }
    .rul2 { stroke:#9a5b12; stroke-width:1.4; fill:none; }
    .pun  { font:15px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; fill:#0b2942; }
    .big  { font:600 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:#8b2c0d; }
  </style>
  <rect class="bg" x="0.5" y="0.5" width="899" height="595" rx="6"/>

  <!-- ── noodles ───────────────────────────────────────────── -->
  <text class="code" x="34" y="46">let noodles = "noodles".to_string();</text>
  <g>
    <rect class="cell" x="34"  y="62" width="62" height="46"/><text class="glyph" x="65"  y="92">n</text><text class="hex" x="65"  y="126">6E</text>
    <rect class="cell" x="96"  y="62" width="62" height="46"/><text class="glyph" x="127" y="92">o</text><text class="hex" x="127" y="126">6F</text>
    <rect class="cell" x="158" y="62" width="62" height="46"/><text class="glyph" x="189" y="92">o</text><text class="hex" x="189" y="126">6F</text>
    <rect class="cell" x="220" y="62" width="62" height="46"/><text class="glyph" x="251" y="92">d</text><text class="hex" x="251" y="126">64</text>
    <rect class="cell" x="282" y="62" width="62" height="46"/><text class="glyph" x="313" y="92">l</text><text class="hex" x="313" y="126">6C</text>
    <rect class="cell" x="344" y="62" width="62" height="46"/><text class="glyph" x="375" y="92">e</text><text class="hex" x="375" y="126">65</text>
    <rect class="cell" x="406" y="62" width="62" height="46"/><text class="glyph" x="437" y="92">s</text><text class="hex" x="437" y="126">73</text>
  </g>
  <text class="tag" x="500" y="80">len() = 7</text>
  <text class="lab" x="500" y="100">chars().count() = 7</text>
  <text class="lab" x="500" y="120">one byte each — all ASCII</text>

  <!-- ── oodles: a borrowed run of the same bytes ──────────── -->
  <path class="rule" d="M96 150 v10 h372 v-10"/>
  <text class="code" x="96" y="186">let oodles = &amp;noodles[1..];</text>
  <text class="tag"  x="500" y="172">len() = 6</text>
  <text class="lab"  x="500" y="192">the same bytes, six of them — no copy</text>

  <line x1="34" y1="222" x2="866" y2="222" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ── poodles ───────────────────────────────────────────── -->
  <text class="code" x="34" y="252">let poodles = "ಠ_ಠ";</text>
  <text class="glyph" x="127" y="292">ಠ</text>
  <text class="glyph" x="251" y="292">_</text>
  <text class="glyph" x="375" y="292">ಠ</text>
  <path class="rul2" d="M34 300 v10 h186 v-10"/>
  <path class="rule" d="M220 300 v10 h62 v-10"/>
  <path class="rul2" d="M282 300 v10 h186 v-10"/>
  <g>
    <rect class="cel2" x="34"  y="314" width="62" height="46"/><text class="hex" x="65"  y="343">E0</text>
    <rect class="cel2" x="96"  y="314" width="62" height="46"/><text class="hex" x="127" y="343">B2</text>
    <rect class="cel2" x="158" y="314" width="62" height="46"/><text class="hex" x="189" y="343">A0</text>
    <rect class="cell" x="220" y="314" width="62" height="46"/><text class="glyph" x="251" y="344">_</text>
    <rect class="cel2" x="282" y="314" width="62" height="46"/><text class="hex" x="313" y="343">E0</text>
    <rect class="cel2" x="344" y="314" width="62" height="46"/><text class="hex" x="375" y="343">B2</text>
    <rect class="cel2" x="406" y="314" width="62" height="46"/><text class="hex" x="437" y="343">A0</text>
  </g>
  <text class="hex" x="127" y="380">U+0CA0 — three bytes</text>
  <text class="hex" x="251" y="380">U+005F</text>
  <text class="hex" x="375" y="380">U+0CA0 — three bytes</text>
  <text class="tag" x="500" y="332">len() = 7</text>
  <text class="lab" x="500" y="352">chars().count() = 3</text>
  <text class="lab" x="500" y="372">3 + 1 + 3 bytes</text>

  <!-- ── the point ─────────────────────────────────────────── -->
  <rect x="34" y="424" width="832" height="120" rx="6" fill="#fbf3e7" stroke="#9a5b12" stroke-width="1.2"/>
  <text class="pun" x="56" y="456"><tspan class="big">noodles</tspan> and <tspan class="big">poodles</tspan> both report <tspan class="big">len() == 7</tspan>.</text>
  <text class="pun" x="56" y="484">One of them is seven characters. The other is three.</text>
  <text class="pun" x="56" y="518">A <tspan class="big">String</tspan> counts its <tspan style="font-style:italic">bytes</tspan>, because that is the one number it can give you without decoding anything.</text>
</svg>
