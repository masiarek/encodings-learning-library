# MkDocs Material site for the whole repo — publishes every Markdown page as a
# searchable website on GitHub Pages.
#
#   Local preview:  uv run --group docs mkdocs serve
#                   (toolchain pinned in pyproject.toml [dependency-groups].docs + uv.lock)
#   Deploy:         .github/workflows/docs.yml builds on every push to master
#                   (one-time setup: repo Settings → Pages → Source: GitHub Actions)
#
# The docs root IS the repo root (mkdocs-same-dir), so there is no docs/ copy step:
# the same Markdown GitHub renders is what the site serves, and the example
# sources (.py / .rs / .sh) are carried through so links to them keep working.

site_name: Encodings — Learning Library
site_description: Bits, bytes, characters, encodings and strings — one idea per page, every claim backed by a program that runs and is checked against its recorded output in CI.
site_url: https://masiarek.github.io/encodings-learning-library/
repo_url: https://github.com/masiarek/encodings-learning-library
repo_name: masiarek/encodings-learning-library
edit_uri: edit/master/

docs_dir: .
site_dir: site

# Cross-links are authored for GitHub's file-relative rendering (including links
# to a folder's README.md). Plain .html pages keep those exact semantics; pretty
# directory URLs would shift every page one level deeper and break them.
use_directory_urls: false

# A link to a heading that does not exist is a broken link. MkDocs 1.6 checks
# a link's #fragment against the ids of the page it points at, and by default
# reports a miss at `info` -- which --strict does not count. Until 2026-09-10 a
# planted `../preparing_a_string/README.md#no-such-heading` built green, its
# verdict one INFO line in the log. At `warn` the same build fails.
#
# unrecognized_links has the same default one step earlier. A link to a folder
# (`../preparing_a_string/`) names no file, so MkDocs leaves it as is, at
# `info`, and never gets as far as its #fragment: until 2026-09-11 that link
# built green with a #no-such-heading on the end or without one. At `warn`
# both fail, which makes CONTRIBUTING's never-link-a-folder rule a gate. What
# neither setting can see is in CONTRIBUTING.md under Links: a fragment in a
# build run with -v, and GitHub's ids, which are not always this site's.
# tools/check_fragments.py covers both for a link written in Markdown.
validation:
  links:
    anchors: warn
    unrecognized_links: warn

# MkDocs maps README.md onto index.md, so the root README and index.md collide
# ("Excluding README.md because it conflicts with index.md" — a --strict failure).
# Excluding it is right rather than a workaround: its content already IS the
# homepage, inlined by index.md through pymdownx.snippets, which reads from disk
# and so is unaffected. GitHub still renders it as the repo front page.
#
# The leading slash anchors the pattern to the repo root. Without it, .gitignore
# semantics would match README.md at ANY depth and silently delete every folder's
# section landing page from the site.
exclude_docs: |
  /README.md
  __pycache__/

# Built and linkable, but kept out of the sidebar: house conventions are for
# someone about to write a page, not for a reader browsing lessons.
not_in_nav: |
  /CONTRIBUTING.md

theme:
  name: material
  icon:
    logo: material/code-brackets
  features:
    - navigation.indexes    # a folder's README.md becomes its section landing page
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# Build-time fixes that would otherwise need a plugin (and a new pinned
# dependency): sidebar section labels, which MkDocs derives from folder names.
hooks:
  - mkdocs_hooks.py

plugins:
  - search
  - same-dir

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  # Mermaid diagrams. The custom fence is what makes ```mermaid render as a
  # diagram on the site; GitHub renders the same fence natively, so one source
  # serves both surfaces. Without it the fence ships as a grey code block.
  #
  # preserve_tabs: Python-Markdown expands every TAB in a page to spaces before
  # any fence is parsed, so every TAB in a fence reached the site as spaces,
  # while GitHub kept the byte. This lifts fences out ahead of that pass.
  # Indented code blocks and inline code still lose theirs. Upstream calls the
  # option experimental, so mkdocs_hooks.py counts each page's fenced TABs back
  # out of its HTML, and --strict fails on a page that lost one.
  - pymdownx.superfences:
      preserve_tabs: true
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Lets index.md inline sections of README.md, so the repo front page and the
  # site homepage share one source and cannot drift.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/masiarek/encodings-learning-library
