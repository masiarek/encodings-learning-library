[project]
name = "encodings-learning-library"
version = "0.1.0"
description = "A runnable learning library about bits, bytes, characters, encodings and strings, published as a searchable site."
requires-python = ">=3.11"
dependencies = []

# Not an installable package — just a place to pin the docs toolchain so CI and
# the local preview resolve the exact same versions from uv.lock.
[tool.uv]
package = false

[dependency-groups]
# The MkDocs site build. To change a docs dependency, edit here and run `uv lock`.
# mkdocs-same-dir is pinned exactly: it is the plugin that lets the docs root be
# the repo root, and it is the one most likely to break the whole build silently.
#
# Note what is NOT here: the examples have no dependencies at all. Python ones
# are stdlib-only, Rust ones compile with bare rustc, shell ones use the tools a
# Mac or an Ubuntu box already ships with.
docs = [
    "mkdocs-material>=9.5",
    "mkdocs-same-dir==0.1.3",
]
